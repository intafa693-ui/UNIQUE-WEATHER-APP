<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="header">
           <input id="input" type="text" placeholder="search city....">
           <button id="btn">🔍︎</button>
        </div>
        <div class="footer-content">
        <div class="content">
          <img src="image.png" alt="">
          <div class="content-text">
            <h1 id="tempreture">20°C</h1>
            <h3 id="town">city</h3>
          </div>
        </div>
        <div class="footer">
           <div>
            <div class="humidity">
                <span>💧</span>
                <div>
                    <h3 id="humidity">30%</h3>
                    <p>humidity</p>
                </div>
            </div>
           </div>
           <div>
            <div class="humidity">
                <span>🌊</span>
                <div>
                    <h3 id="windSpeed">10km/h</h3>
                    <p>Windspeed</p>
                </div>
            </div>
           </div>
           <div>
            <div class="humidity">
                <span>🌡️</span>
                <div>
                    <h3 id="fillLike">28%</h3>
                    <p>Feels like</p>
                </div>
            </div>
           </div>
        </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
